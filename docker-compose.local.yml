version: '3.8'

services:
  # PostgreSQL Database with O.R.I SOLAR Schema
  postgres:
    image: postgres:15-alpine
    platform: linux/amd64
    container_name: solar-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: solar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/00-auth-schema.sql:/docker-entrypoint-initdb.d/00-auth-schema.sql:ro
      - ./supabase-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./scripts/02-demo-data.sql:/docker-entrypoint-initdb.d/02-demo-data.sql:ro
    networks:
      - solar-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solar"]
      interval: 5s
      timeout: 5s
      retries: 5

  # O.R.I SOLAR Frontend - Expo Development Server
  solar-dev:
    image: node:18-alpine
    platform: linux/amd64
    container_name: solar-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.expo
    ports:
      - "8081:8081"   # Expo Metro bundler (web)
      - "19000:19000" # Expo dev server
      - "19006:19006" # Expo web (default port)
    command: sh -c "npm install --legacy-peer-deps && npx expo start --web --port 8081"
    environment:
      - NODE_ENV=development
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      # Local PostgreSQL connection (for direct DB access if needed)
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/solar
      # Simplified Supabase-compatible auth (points to local postgres)
      - EXPO_PUBLIC_SUPABASE_URL=http://postgres:5432
      - EXPO_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      - EXPO_PUBLIC_APP_NAME=O.R.I SOLAR
      - EXPO_PUBLIC_APP_VERSION=1.0.0
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - solar-local
    stdin_open: true
    tty: true

volumes:
  postgres-data:

networks:
  solar-local:
    driver: bridge
